; 
; Syntax of this configuration file:
; 
; [key]: setting key
; - Field "description": description, just for information.
; - Field "type": type of setting, e. g. mail, number, foreign_key, etc.
; - Field "default": default value
; - Field "db_field": corresponding database field (table.field)
;

[context]
scope[] = categories
subtree[] = roles
subtree[] = event
example[] = "context[events_contacts]=1"
example[] = "context[events_projects]=1"

[events_contacts]
description = "Form context: event contact roles subtable"
scope[] = context

[events_accommodation]
description = "Allow to select contacts from this category as accommodation for an event"
type = bool
scope[] = categories
subtree[] = contact

[events_direct_link]
description = "On event-detail categories: use identification as the event's external link (exposed as direct_link in output)"
scope[] = categories
subtree[] = event-details
type = bool
example[] = "events_direct_link=1"

[events_big_image_size]
description = "Size of image linked from standard image in event"
type = path
install = 1

[events_category_properties]
description = "Use field events_categories.property to set values for categories"
type = bool
backend_for_website = 1

[events_check]
description = "Show this event menu link only if the target page exists (URL check succeeded)"
type = bool
scope[] = eventmenus

[events_client]
description = "Allow this contact category in events_contacts when the role path is client"
type = bool
scope[] = categories
subtree[] = contact

[events_contributor]
description = "Allow this contact category in events_contacts when the role path is contributor"
type = bool
scope[] = categories
subtree[] = contact

[events_deadlines]
description = "Include this event category in deadline pickers"
type = bool
scope[] = categories
subtree[] = event

[events_education_data]
description = "Show a block with data on the education system of the organization"
type = bool
scope[] = events
scope[] = categories
subtree[] = events

[events_event_abbr]
description = "Allow to set abbreviation for events"
type = bool

[events_event_year]
description = "Allow to set a different event year than when the event takes place"
type = bool

[events_fee_internal]
description = "Booking category for staff-only manual booking lines (admin add menu)"
scope[] = none
type = bool

[events_fee_mandatory]
description = "Mark as a mandatory fee for an event registration"
scope[] = none
type = bool

[events_fees]
description = "Show fees in registration form"
scope[] = none
type = bool

[events_fees_inherit]
description = "Inherit fees from main event"
scope[] = none
type = bool

[events_fee_optional]
description = "Mark as an optional fee add-on for an event registration"
scope[] = categories
subtree[] = costs
type = bool

[events_fee_participant]
description = "Cost or booking category applies to participant-facing fees"
scope[] = none
type = bool

[events_hide_date_end]
description = "Hide the end date field on the child-event subtable of the main event form"
type = bool
scope[] = categories
subtree[] = event

[events_host]
description = "Allow to select contacts from this category as hosts of an event"
type = bool
scope[] = categories
subtree[] = contact

[events_ics_calname]
description = "Name of the calendar for ICS export"
type = string
default_from_setting = project

[events_ics_caldesc]
description = "Description of the calendar for ICS export"
type = string
install = 1

[events_image_size]
description = "Standard size of image displayed in event"
type = path
install = 1

[events_image_size_x2]
description = "Retina 2x size of image displayed in event"
type = path
install = 1

[events_leaflet_map]
description = "Show a leaflet map next to the event"
type = bool

[events_list_image_size]
description = "Size of image in events list"
type = path
install = 1

[events_location]
description = "Allow to select contacts from this category as location for an event"
type = bool
scope[] = categories
subtree[] = contact

[events_media_per_event]
description = "Maximum no. of media files per event"
type = int
default = 10

[events_name_tag_size]
description = "Size of name tag PDF layout, e.g. 9x5.5 or 10.5x7"
default = 10.5x7
scope[] = categories
subtree[] = events
subtree[] = series
scope[] = events
example[] = "events_name_tag_size=9x5.5"

[events_name_tag_line]
description = "Show this registration field on the participant name tag in given line"
scope[] = none

[events_og_image_size]
description = "Size in px of image for OpenGraph (Facebook, Twitter)"
type = int
default_from_setting = opengraph_image_size

[events_organiser]
description = "Allow to select contacts from this category as organiser of an event"
type = bool
scope[] = categories
subtree[] = contact

[events_own_event]
description = "Treat events linked via this role category as own events in the calendar"
type = bool
scope[] = categories
subtree[] = roles

[events_participation_in_order_of_registration]
description = "Determine participation by registration order (first registered first)"
type = bool
scope[] = events
scope[] = categories
subtree[] = events

[events_project_image_pages]
description = "Split project images across several subpages"
type = bool

[events_project_needs_images]
description = "Only show a project if it has at least one image associated"
type = bool
page_parameter = 1
scope[] = webpages
scope[] = website

[events_projects]
description = "Form context: project contact roles subtable"
scope[] = context

[events_projects_abstract_first]
description = "Show description in projects list directly after project"
type = bool

[events_projects_links]
description = "Allow to add links to projects"
type = bool

[events_running]
description = "Show this event menu link only while the event is running (within its begin/end dates)"
type = bool
scope[] = eventmenus

[events_timetable_image_size]
description = "Size of images displayed in timetable"
type = path

[events_show_in_news]
description = "Allow to show an event as a news item"
type = bool

[events_series_category]
description = "Use series_category_id to determine series of an event, not events_categories (@deprecated)"
type = bool

[events_sponsor]
description = "Allow to select contacts from this category as sponsors of an event"
type = bool
scope[] = categories
subtree[] = contact

[events_timetable]
description = "Form context: timetable location role"
scope[] = context

[events_timetable_copy]
description = "Allow events of this event category to be copied"
type = bool
scope[] = categories
subtree[] = event

[events_timetable_extra_fields]
description = "List of fields in events table that need to be copied, too"
list = 1
scope[] = internal

[events_timetable_placeholder]
description = "Placeholder to place timetable at given position on page"
default = "timetable"

[events_texts_module]
description = "Zugzwang module that owns or provides this event-text category (e.g. tournaments, downloads)"
scope[] = categories
subtree[] = event-texts
example[] = "events_texts_module=downloads"
example[] = "events_texts_module=tournaments"

[events_timezone]
description = "Timezone if all events in the calendar are in the same timezone; offset from UTC, format ±HHMM (e.g. +0100)"
type = string
pattern = "^\[+-][0-9]{4}$"

[events_timezone_default]
description = "Default timezone; offset from UTC, format ±HHMM (e.g. +0100)"
type = string
pattern = "^\[+-][0-9]{4}$"

[events_video_image_size]
description = "Standard size of video and poster image in an event"
type = int
default = 960

[search]
scope[] = categories
subtree[] = events

[zzform]
scope[] = categories
subtree[] = event
subtree[] = projects
subtree[] = roles
